<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vezlo Mart — Checkout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root[data-theme="dark"] { --bg: #0a0e1a; --bg-2: #0f1626; --bg-3: #151f36; --card: #131b2e; --border: #1f2c47; --text: #e6ecf5; --text-dim: #8a96b0; --text-muted: #5d6a86; --primary: #2563eb; --primary-2: #3b82f6; --primary-glow: rgba(37,99,235,0.4); --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --gradient: linear-gradient(135deg, #2563eb 0%, #06b6d4 100%); --shadow-lg: 0 20px 60px rgba(0,0,0,0.5); }
  :root[data-theme="light"] { --bg: #f5f7fb; --bg-2: #ffffff; --bg-3: #eef2f9; --card: #ffffff; --border: #e2e8f0; --text: #0f172a; --text-dim: #475569; --text-muted: #94a3b8; --primary: #2563eb; --primary-2: #3b82f6; --primary-glow: rgba(37,99,235,0.25); --success: #059669; --warning: #d97706; --danger: #dc2626; --gradient: linear-gradient(135deg, #2563eb 0%, #06b6d4 100%); --shadow-lg: 0 20px 50px rgba(15,23,42,0.12); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
  a { text-decoration: none; color: inherit; }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

  .mini-header { background: var(--bg-2); border-bottom: 1px solid var(--border); padding: 16px 0; position: sticky; top: 0; z-index: 50; }
  .mini-header-inner { display: flex; align-items: center; justify-content: space-between; }
  .logo { font-family: 'Poppins'; font-weight: 800; font-size: 20px; display: flex; align-items: center; gap: 10px; color: var(--text); }
  .logo i { color: var(--primary); }
  .icon-btn { width: 42px; height: 42px; border-radius: 11px; background: var(--bg-3); border: 1px solid var(--border); display: grid; place-items: center; font-size: 17px; color: var(--text); cursor: pointer; }
  
  .checkout-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 40px; padding: 40px 0; }
  
  .checkout-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; margin-bottom: 24px; }
  .checkout-card h3 { font-family: 'Poppins'; font-size: 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
  .checkout-card h3 i { color: var(--primary); }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-group { margin-bottom: 16px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-group label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; font-weight: 600; }
  .form-input { width: 100%; padding: 14px 16px; background: var(--bg-3); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px; font-family: inherit; }
  .form-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); }

  .option-group { display: grid; gap: 12px; }
  .option { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; cursor: pointer; transition: all 0.2s; }
  .option:hover { border-color: var(--primary); background: var(--bg-3); }
  .option input { width: 18px; height: 18px; accent-color: var(--primary); }
  .option-content { flex: 1; }
  .option-content strong { display: block; font-size: 14px; }
  .option-content small { color: var(--text-muted); }
  .option-price { font-weight: 700; color: var(--primary); }

  /* Summary */
  .summary-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; position: sticky; top: 90px; }
  .summary-card h3 { font-family: 'Poppins'; font-size: 18px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
  .summary-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .summary-item img { width: 50px; height: 50px; border-radius: 8px; background: var(--bg-3); display: grid; place-items: center; font-size: 20px; color: var(--text-muted); }
  .summary-item-info { flex: 1; }
  .summary-item-info h5 { font-size: 13px; margin-bottom: 4px; }
  .summary-item-info small { color: var(--text-muted); }
  .summary-item-price { font-weight: 700; font-size: 14px; }
  
  .summary-totals { margin: 20px 0; }
  .summary-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; color: var(--text-dim); }
  .summary-row.total { font-size: 18px; font-weight: 800; color: var(--text); padding-top: 16px; border-top: 1px solid var(--border); margin-top: 16px; }
  .summary-row.total span:last-child { color: var(--primary); font-family: 'Poppins'; }

  .btn { width: 100%; padding: 16px; border-radius: 12px; border: none; font-weight: 700; font-size: 16px; cursor: pointer; background: var(--gradient); color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform 0.2s; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(37,99,235,0.4); }

  .success-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: none; place-items: center; z-index: 100; }
  .success-modal.open { display: grid; }
  .success-box { background: var(--bg-2); padding: 50px 40px; border-radius: 20px; text-align: center; max-width: 400px; border: 1px solid var(--border); }
  .success-icon { width: 80px; height: 80px; border-radius: 50%; background: var(--success); color: #fff; display: grid; place-items: center; font-size: 36px; margin: 0 auto 24px; }
  .success-box h2 { font-family: 'Poppins'; margin-bottom: 10px; }
  .success-box p { color: var(--text-dim); margin-bottom: 24px; }

  @media (max-width: 768px) {
    .checkout-grid { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    .summary-card { position: static; }
  }
</style>
</head>
<body>

<header class="mini-header">
  <div class="container mini-header-inner">
    <a href="store.html" class="logo"><i class="fas fa-bag-shopping"></i> Vezlo Mart</a>
    <button class="icon-btn" onclick="toggleTheme()"><i class="fas fa-sun"></i><i class="fas fa-moon" style="display:none"></i></button>
  </div>
</header>

<div class="container">
  <div class="checkout-grid">
    <!-- Left Side: Forms -->
    <div>
      <div class="checkout-card">
        <h3><i class="fas fa-user"></i> Customer Information</h3>
        <div class="form-grid">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" class="form-input" placeholder="John Doe" />
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="text" class="form-input" placeholder="+94 77 123 4567" />
          </div>
          <div class="form-group full">
            <label>Delivery Address</label>
            <input type="text" class="form-input" placeholder="No. 123, Galle Road, Colombo 03" />
          </div>
          <div class="form-group">
            <label>City</label>
            <input type="text" class="form-input" placeholder="Colombo" />
          </div>
          <div class="form-group">
            <label>Postal Code</label>
            <input type="text" class="form-input" placeholder="00300" />
          </div>
        </div>
      </div>

      <div class="checkout-card">
        <h3><i class="fas fa-truck-fast"></i> Shipping Method</h3>
        <div class="option-group">
          <label class="option">
            <input type="radio" name="shipping" checked>
            <div class="option-content">
              <strong>Standard Delivery</strong>
              <small>3-5 Business Days</small>
            </div>
            <span class="option-price">LKR 350</span>
          </label>
          <label class="option">
            <input type="radio" name="shipping">
            <div class="option-content">
              <strong>Express Delivery</strong>
              <small>1-2 Business Days</small>
            </div>
            <span class="option-price">LKR 750</span>
          </label>
        </div>
      </div>

      <div class="checkout-card">
        <h3><i class="fas fa-credit-card"></i> Payment Method</h3>
        <div class="option-group">
          <label class="option">
            <input type="radio" name="payment" checked>
            <div class="option-content">
              <strong>Cash on Delivery (COD)</strong>
              <small>Pay when you receive</small>
            </div>
            <i class="fas fa-money-bill-wave" style="color: var(--success)"></i>
          </label>
          <label class="option">
            <input type="radio" name="payment">
            <div class="option-content">
              <strong>Bank Deposit</strong>
              <small>Transfer to our NSB Bank account</small>
            </div>
            <i class="fas fa-building-columns" style="color: var(--primary)"></i>
          </label>
        </div>
      </div>
    </div>

    <!-- Right Side: Order Summary -->
    <div>
      <div class="summary-card">
        <h3>Order Summary</h3>
        <div id="summaryItems"></div>
        
        <div class="summary-totals">
          <div class="summary-row">
            <span>Subtotal</span>
            <span id="sumSubtotal">LKR 0</span>
          </div>
          <div class="summary-row">
            <span>Discount</span>
            <span style="color: var(--success)" id="sumDiscount">- LKR 0</span>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <span>LKR 350</span>
          </div>
          <div class="summary-row total">
            <span>Total</span>
            <span id="sumTotal">LKR 0</span>
          </div>
        </div>
        
        <button class="btn" onclick="placeOrder()">
          <i class="fas fa-lock"></i> Place Order
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Success Modal -->
<div class="success-modal" id="successModal">
  <div class="success-box">
    <div class="success-icon"><i class="fas fa-check"></i></div>
    <h2>Order Placed!</h2>
    <p>Thank you for shopping with Vezlo Mart. Your order has been received and will be processed shortly.</p>
    <button class="btn" onclick="window.location.href='store.html'">Continue Shopping</button>
  </div>
</div>

<script>
  const products = [
    { id: 1, name: "JBL Tune 760BT", brand: "JBL", price: 16900, old: 23900, icon: "fa-headphones" },
    { id: 2, name: "Samsung Galaxy A06", brand: "Samsung", price: 23900, old: 28900, icon: "fa-mobile-screen" },
    { id: 3, name: "Smart Watch Series 7", brand: "VezloTech", price: 12500, old: 18900, icon: "fa-stopwatch" },
    { id: 4, name: "Pro Running Shoes", brand: "SportX", price: 6900, old: 9900, icon: "fa-shoe-prints" },
    { id: 5, name: "Travel Backpack 30L", brand: "TravelPro", price: 4900, old: 6200, icon: "fa-suitcase" }
  ];

  function getCart() { return JSON.parse(localStorage.getItem('vezlo-cart')) || []; }
  function findProduct(id) { return products.find(p => p.id === id); }

  function renderSummary() {
    const cart = getCart();
    const container = document.getElementById('summaryItems');

    if (cart.length === 0) {
      container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 20px 0;">Your cart is empty.</p>';
      document.getElementById('sumSubtotal').textContent = 'LKR 0';
      document.getElementById('sumDiscount').textContent = '- LKR 0';
      document.getElementById('sumTotal').textContent = 'LKR 0';
      return;
    }

    container.innerHTML = cart.map(item => {
      const p = findProduct(item.id);
      if (!p) return '';
      return `
        <div class="summary-item">
          <div style="width:50px;height:50px;border-radius:8px;background:var(--bg-3);display:grid;place-items:center;font-size:20px;color:var(--text-muted);">
            <i class="fas ${p.icon}"></i>
          </div>
          <div class="summary-item-info">
            <h5>${p.name} <small>x${item.qty}</small></h5>
            <small>${p.brand}</small>
          </div>
          <div class="summary-item-price">LKR ${(p.price * item.qty).toLocaleString()}</div>
        </div>
      `;
    }).join('');

    const subtotal = cart.reduce((s, it) => s + findProduct(it.id).price * it.qty, 0);
    const oldTotal = cart.reduce((s, it) => s + (findProduct(it.id).old || findProduct(it.id).price) * it.qty, 0);
    const discount = oldTotal - subtotal;
    const shipping = 350;
    const total = subtotal + shipping;

    document.getElementById('sumSubtotal').textContent = `LKR ${oldTotal.toLocaleString()}`;
    document.getElementById('sumDiscount').textContent = `- LKR ${discount.toLocaleString()}`;
    document.getElementById('sumTotal').textContent = `LKR ${total.toLocaleString()}`;
  }

  function placeOrder() {
    // Clear cart
    localStorage.removeItem('vezlo-cart');
    // Show success modal
    document.getElementById('successModal').classList.add('open');
  }

  function toggleTheme() {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('vezlo-theme', next);
    document.querySelector('.fa-sun').style.display = next === 'light' ? 'block' : 'none';
    document.querySelector('.fa-moon').style.display = next === 'dark' ? 'block' : 'none';
  }

  // Init
  const savedTheme = localStorage.getItem('vezlo-theme');
  if (savedTheme) {
    document.documentElement.setAttribute('data-theme', savedTheme);
    if (savedTheme === 'light') {
      document.querySelector('.fa-sun').style.display = 'block';
      document.querySelector('.fa-moon').style.display = 'none';
    }
  } else {
    document.querySelector('.fa-sun').style.display = 'none';
  }

  renderSummary();
</script>
</body>
</html>
