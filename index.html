<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Vezlo Mart is coming soon.">
  <title>Vezlo Mart | Coming Soon</title>
  <link rel="icon" href="assets/vezlo-logo.png">
  <style>
    :root{--bg:#050505;--card:rgba(255,255,255,.055);--border:rgba(255,255,255,.12);--gold:#ffb51b;--gold2:#ffd45c;--white:#fff;--muted:#aaa}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--white)}
    body{overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
    body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(2px);pointer-events:none;z-index:0}
    body:before{width:520px;height:520px;background:radial-gradient(circle,rgba(255,181,27,.14),transparent 68%);top:-230px;right:-130px}
    body:after{width:460px;height:460px;background:radial-gradient(circle,rgba(255,181,27,.09),transparent 70%);bottom:-230px;left:-120px}
    .grid{position:fixed;inset:0;opacity:.08;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:55px 55px;mask-image:linear-gradient(to bottom,transparent,black 30%,black 70%,transparent)}
    .wrap{width:min(940px,92%);position:relative;z-index:2;text-align:center}
    .card{padding:clamp(38px,7vw,78px) clamp(22px,6vw,70px);border:1px solid var(--border);border-radius:32px;background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));backdrop-filter:blur(22px);box-shadow:0 30px 100px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.08)}
    .logo{width:clamp(125px,18vw,190px);height:auto;margin-bottom:28px;filter:drop-shadow(0 12px 30px rgba(255,181,27,.12))}
    .badge{display:inline-flex;align-items:center;gap:9px;padding:9px 15px;border:1px solid rgba(255,181,27,.3);border-radius:999px;background:rgba(255,181,27,.07);color:var(--gold2);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:23px}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 16px var(--gold);animation:pulse 1.8s infinite}
    @keyframes pulse{50%{opacity:.35;transform:scale(.75)}}
    h1{font-size:clamp(48px,9vw,96px);line-height:.92;letter-spacing:-4px;font-weight:900;margin-bottom:22px}
    h1 span{display:block;background:linear-gradient(90deg,var(--white),var(--gold2),var(--white));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s ease-in-out infinite}
    @keyframes shine{50%{background-position:100% 50%}}
    .lead{max-width:620px;margin:0 auto;color:#c0c0c0;font-size:clamp(15px,2vw,18px);line-height:1.7}
    .line{width:90px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:30px auto}
    .message{font-size:clamp(18px,3vw,25px);font-weight:700;margin-bottom:9px}
    .sub{color:var(--muted);font-size:14px}
    .links{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:30px}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-width:145px;padding:13px 20px;border-radius:14px;border:1px solid var(--border);text-decoration:none;color:var(--white);background:rgba(255,255,255,.045);font-weight:700;font-size:14px;transition:.25s ease}
    .btn:hover{transform:translateY(-2px);border-color:rgba(255,181,27,.5);background:rgba(255,181,27,.08)}
    .btn.primary{border-color:rgba(255,181,27,.45);background:linear-gradient(135deg,var(--gold),#e69500);color:#111;box-shadow:0 10px 30px rgba(255,181,27,.16)}
    footer{margin-top:25px;color:#777;font-size:12px}footer a{color:#aaa;text-decoration:none}footer a:hover{color:var(--gold2)}
    @media(max-width:600px){body{overflow:auto;min-height:100svh;padding:18px 0}.card{border-radius:25px}.logo{margin-bottom:22px}h1{letter-spacing:-2px}.lead{line-height:1.6}.links{flex-direction:column}.btn{width:100%}footer{margin-bottom:5px}}
  </style>
</head>
<body>
  <div class="grid"></div>
  <main class="wrap">
    <section class="card">
      <img class="logo" src="assets/vezlo-logo.png" alt="Vezlo Mart">
      <div class="badge"><span class="dot"></span> New Store Experience</div>
      <h1>COMING <span>SOON.</span></h1>
      <p class="lead">We're rebuilding Vezlo Mart into a better, faster and smarter shopping experience.</p>
      <div class="line"></div>
      <p class="message">Everyday. For a Better You. ✨</p>
      <p class="sub">Our new store is currently under development. Stay tuned.</p>
      <div class="links">
        <a class="btn primary" href="mailto:chat.dmkaawya@gmail.com">Contact Us</a>
        <a class="btn" href="https://www.facebook.com/" target="_blank" rel="noopener">Follow Us</a>
      </div>
      <footer>© <span id="year"></span> Vezlo Mart · Design by <a href="https://vezlo-web.vercel.app/" target="_blank" rel="noopener">Vezlo Web Dev</a></footer>
    </section>
  </main>
  <script>document.getElementById('year').textContent=new Date().getFullYear();</script>
</body>
</html>
